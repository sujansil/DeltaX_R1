services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: round1_test
      POSTGRES_USER: round1_test
      POSTGRES_PASSWORD: round1_test_only
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U round1_test -d round1_test"]
      interval: 1s
      timeout: 3s
      retries: 30

